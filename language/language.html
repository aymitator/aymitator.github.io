<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>language</title>
<style>
#outout{ width: 90% }
</style>
<script>
//TODO: ctring len, array len
//      match or matches?
var d = document;
function go(_s) {
return d.getElementById(_s);
}
function searchh(_s){
if(_s.length < 3)return;
var reg = /^[a-z]+$/i;
if(_s.match(reg) === null)return;
reg = null;
var regii = new RegExp(_s);
var lang = [
"meine Schuh (my shoe)",
"der Schuh (at/at-being a shoe)",
"der Schuhe (at/at/at-being shoes)",
"giacca ((italian)) (bigger t-shirt)",
"camiseta (t-shirt)",
"camisa (shirt / t-shirt)",
"ad ayuda (to-to aid while aiding/aided)",
"ayuda (to aid [at being aid])",
"trabajo (job)",
"trabajar (job doing/doingnecc)",
"dayccenador (web out guy)",
"herramienta (utility utility)",
"bueno (good)",
"buenos noches (nighty night)"
];
var myout = [];
for (var i=0; i<lang.length; i++)
  if(lang[i].match(regii))
    myout.push(lang[i]);
regii = null;
var szout = "<ul>";
for(var i=0; i<myout.length; i++)
  szout += "<li>" + myout[i] + "</li>";
myout = null;  
go("outout").innerHTML = szout + "</ul>";
szout = null;
}
</script>
</head>
<body onload="go('tsz').focus()">
<h1>language</h1>
<h2>unlicense licensed
(https://unlicense.org)</h2>
<input type="text" placeholder="serchitem" id="tsz" size="40" onkeyup="searchh(this.value)">
<br>
<div id="outout">

</div>

</body>
</html>
